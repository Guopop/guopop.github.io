# Homepage Config
# true: the home page shows only its own text. false: it also lists the latest posts.
isSinglePage = false
# true: the home page is the whole blog with its own pages. false: older posts continue on /posts/.
homePagination = true

# Meta Config
description = "Hello"

# Header Configuration
avatar = "img/me.png"

#favicon
favicon = "icons/favicon.ico"

[emoji]
enableEmoji = true

[markup.highlight]
  style = 'dracula'
  noClasses = true
  lineNos = false
  tabWidth = 4